<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="以复古电脑和五枚浮动 U 盘为入口的交互式个人作品集。"
    />
    <meta name="theme-color" content="#01050d" />
    <title>Neural Archive — Zeman Portfolio</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2301050d'/%3E%3Crect x='10' y='10' width='44' height='34' rx='4' fill='%23081726' stroke='%2300d9ff' stroke-width='2'/%3E%3Ccircle cx='32' cy='27' r='9' fill='none' stroke='%2366e8ff' stroke-width='2'/%3E%3Cpath d='M27 24c2-5 8-5 10 0M27 30c2 5 8 5 10 0M7 49h50l-4 6H11z' fill='%230b2b43' stroke='%2300d9ff' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#project-list">跳到作品列表</a>

    <header class="site-header" aria-label="网站标题与声音设置">
      <a class="wordmark" href="#top" aria-label="返回顶部">
        <span class="wordmark-mark" aria-hidden="true"></span>
        <span>NEURAL<span class="wordmark-dim">/ARCHIVE</span></span>
      </a>
      <div class="header-actions">
        <span class="local-time" id="local-time" aria-label="本地时间">00:00:00</span>
        <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false">
          <span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span>
          <span id="sound-label">声音：开</span>
        </button>
      </div>
    </header>

    <main id="top">
      <section class="scroll-stage" aria-labelledby="page-title">
        <div class="stage-sticky">
          <div class="ambient-glow" aria-hidden="true"></div>
          <div class="noise" aria-hidden="true"></div>

          <div class="intro-copy">
            <p class="kicker"><span>CONSCIOUSNESS ARCHIVE</span><span>NODE 05</span></p>
            <h1 id="page-title">Hello,<br /><em> I'm Zeman.</em></h1>
            <p class="intro-note">选择一枚记忆载体，接入神经终端。向下滚动，观察意识容器。</p>
          </div>

          <div class="system-readout" aria-hidden="true">
            <span>VIEW / <b id="pitch-readout">+4.0°</b></span>
            <span>DEVICE / <b id="device-readout">STANDBY</b></span>
          </div>

          <div class="scene-shell" id="scene-shell">
            <canvas id="scene-canvas" aria-hidden="true"></canvas>

            <div class="project-markers" id="project-list" aria-label="作品 U 盘列表">
              <button class="project-marker marker-left" type="button" data-project="0" aria-label="插入作品 01：动态视觉">
                <span class="marker-line" aria-hidden="true"></span>
                <span class="marker-card"><b>01</b><span>动态视觉<small>MOTION / 2026</small></span></span>
              </button>
              <button class="project-marker marker-right" type="button" data-project="1" aria-label="插入作品 02：品牌实验">
                <span class="marker-line" aria-hidden="true"></span>
                <span class="marker-card"><b>02</b><span>品牌实验<small>IDENTITY / 2026</small></span></span>
              </button>
              <button class="project-marker marker-left" type="button" data-project="2" aria-label="插入作品 03：交互叙事">
                <span class="marker-line" aria-hidden="true"></span>
                <span class="marker-card"><b>03</b><span>交互叙事<small>INTERACTIVE / 2025</small></span></span>
              </button>
              <button class="project-marker marker-right" type="button" data-project="3" aria-label="插入作品 04：空间影像">
                <span class="marker-line" aria-hidden="true"></span>
                <span class="marker-card"><b>04</b><span>空间影像<small>SPATIAL / 2025</small></span></span>
              </button>
              <button class="project-marker marker-top" type="button" data-project="4" aria-label="插入作品 05：游戏原型">
                <span class="marker-line" aria-hidden="true"></span>
                <span class="marker-card"><b>05</b><span>游戏原型<small>PLAY / SOON</small></span></span>
              </button>
            </div>

            <div class="screen-hit" id="screen-hit" role="button" tabindex="0" aria-label="电脑屏幕，选择作品后可打开详情" hidden></div>

            <div class="webgl-fallback" id="webgl-fallback" hidden>
              <p>3D 终端暂时无法启动</p>
              <span>仍可使用周围的作品按钮进行浏览。</span>
            </div>
          </div>

          <div class="scroll-cue" aria-hidden="true">
            <span>SCROLL TO TILT</span>
            <div class="scroll-rail"><i id="scroll-progress"></i></div>
            <b id="scroll-percent">00</b>
          </div>

          <p class="interaction-status" id="interaction-status" aria-live="polite">系统待机 · 请选择一枚 U 盘</p>
        </div>
      </section>

      <section class="end-panel" aria-label="作品浏览提示">
        <p>END OF CONSCIOUSNESS</p>
        <h2>五枚载体，<br />五段游离的意识。</h2>
        <a href="#top">返回终端 <span aria-hidden="true">↗</span></a>
      </section>
    </main>

    <div class="corner-code" aria-hidden="true">SYS.05 / TOKYO</div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
